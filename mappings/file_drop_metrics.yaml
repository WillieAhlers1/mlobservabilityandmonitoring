# Mapping definition for file_drop connector — metric events
# Maps CSV rows from the synthetic data generator to metric_timeseries table.
version: "1"

applies_to:
  source_connector: file_drop
  event_type: metric

entity_resolution:
  strategy: lookup
  match_fields:
    - source: source_entity_ref
      target: entity_aliases.alias_value
  on_no_match: reject

field_mappings:
  - source: payload.metric_value
    target: metric_timeseries.value
    transform: identity

validation_rules:
  - rule: not_null
    field: value
  - rule: numeric
    field: value
  - rule: timestamp_not_future
    field: timestamp

target_table: metric_timeseries
