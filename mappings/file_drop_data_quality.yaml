# Mapping definition for file_drop connector — data quality events
version: "1"

applies_to:
  source_connector: file_drop
  event_type: data_quality

entity_resolution:
  strategy: lookup
  match_fields:
    - source: source_entity_ref
      target: entity_aliases.alias_value
  on_no_match: reject

field_mappings:
  - source: payload.missing_rate
    target: data_quality.missing_rate
    transform: identity

validation_rules: []

target_table: data_quality
