# Mapping definition for file_drop connector — drift events
version: "1"

applies_to:
  source_connector: file_drop
  event_type: drift

entity_resolution:
  strategy: lookup
  match_fields:
    - source: source_entity_ref
      target: entity_aliases.alias_value
  on_no_match: reject

field_mappings:
  - source: payload.value
    target: drift_snapshots.value
    transform: clamp(0, 1)

validation_rules:
  - rule: not_null
    field: value
  - rule: numeric
    field: value
  - rule: range
    field: value
    min: 0
    max: 1

target_table: drift_snapshots
