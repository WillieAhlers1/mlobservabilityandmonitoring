# Mapping definition for file_drop connector — alert events
version: "1"

applies_to:
  source_connector: file_drop
  event_type: alert

entity_resolution:
  strategy: lookup
  match_fields:
    - source: source_entity_ref
      target: entity_aliases.alias_value
  on_no_match: reject

field_mappings:
  - source: payload.severity
    target: alerts.severity
    transform: identity

validation_rules:
  - rule: not_null
    field: severity
  - rule: not_null
    field: alert_type

target_table: alerts
