# Mapping definition for file_drop connector — lifecycle events
version: "1"

applies_to:
  source_connector: file_drop
  event_type: lifecycle

entity_resolution:
  strategy: lookup
  match_fields:
    - source: source_entity_ref
      target: entity_aliases.alias_value
  on_no_match: reject

field_mappings:
  - source: payload.version
    target: lineage_events.version
    transform: identity

validation_rules: []

target_table: lineage_events
