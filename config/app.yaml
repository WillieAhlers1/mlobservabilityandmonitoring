data_source: live
db_path: ml_monitor.db
default_industry: hls
flask:
  debug: false
  port: 5000
ingestion:
  batch_size: 1000
  grace_period_hours: 6
  max_lag_alert_minutes: 30
  poll_interval_seconds: 60
aggregation:
  default_bucket: 1h
  retention_days: 90
connectors:
- id: file-drop-local
  type: file_drop
  watch_directory: ./data/incoming
  processed_directory: ./data/processed
  file_pattern: '*.csv'
  column_mapping:
    entity_ref_column: source_entity_ref
    metric_name_column: metric_name
    value_column: metric_value
    timestamp_column: timestamp
- id: webhook-receiver
  type: webhook
  path: /api/ingest/webhook
  secret_env_var: WEBHOOK_SECRET
  rate_limit: 100
  rate_capacity: 200
  max_payload_bytes: 1048576
agentic:
  enabled: true
  provider: mock
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  azure_endpoint_env: AZURE_OPENAI_ENDPOINT
  azure_deployment: gpt-4o-mini
  max_tokens: 1024
  temperature: 0.2
  max_history_turns: 20
  rate_limit_per_minute: 30
